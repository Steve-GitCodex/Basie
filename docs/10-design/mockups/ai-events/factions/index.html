<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basie · AI Factions prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Outfit:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --clr-bg-base:hsl(30,10%,5%);--clr-bg-surface:hsl(30,9%,8%);--clr-bg-elevated:hsl(30,8%,11%);--clr-bg-panel:hsl(30,8%,14%);
  --clr-bg-active:hsl(32,40%,14%);--clr-border:hsl(30,10%,18%);--clr-border-light:hsl(30,10%,27%);
  --clr-primary:hsl(32,90%,55%);--clr-primary-dark:hsl(30,88%,40%);--clr-success:hsl(90,45%,48%);--clr-warning:hsl(48,95%,52%);
  --clr-danger:hsl(0,85%,58%);--clr-text-primary:hsl(35,15%,93%);--clr-text-secondary:hsl(35,10%,62%);--clr-text-muted:hsl(35,8%,42%);
  --font-heading:'Oswald',sans-serif;--font-body:'Outfit',sans-serif;--font-display:'Orbitron',sans-serif;
  --you:#3ad17a;--scav:#b7d645;--red:#e05a3d;--cov:#6f9fd8;--rebel:#b07ad8;
  --new:hsl(188,85%,58%);--imp:hsl(40,100%,62%);
  --band-g:hsl(90,45%,48%);--band-a:hsl(40,95%,55%);--band-r:hsl(0,80%,60%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0e0c0a;color:var(--clr-text-primary);font-family:var(--font-body);overflow:hidden;display:flex;flex-direction:column}
button{font-family:inherit}
.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}

.top{display:flex;align-items:center;gap:18px;padding:8px 16px;border-bottom:1px solid var(--clr-border);background:var(--clr-bg-surface);flex:none;min-height:46px;flex-wrap:wrap}
.top h1{margin:0;font:700 16px var(--font-heading);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.top h1 small{font:500 13px var(--font-body);letter-spacing:0;text-transform:none;color:var(--clr-text-secondary);margin-left:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--clr-text-secondary);align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}
.mode{margin-left:auto;display:flex;border:1px solid var(--clr-border-light);border-radius:8px;overflow:hidden}
.mode button{background:none;border:0;color:var(--clr-text-secondary);padding:6px 14px;font:600 12px var(--font-body);cursor:pointer}
.mode button.on{background:var(--clr-bg-active);color:var(--clr-primary)}

.tag{display:inline-flex;align-items:center;font:800 9px var(--font-body);letter-spacing:.09em;padding:2px 5px;border-radius:3px;line-height:1;white-space:nowrap;vertical-align:middle}
.tag--new{background:var(--new);color:#03222a}
.tag--imp{background:var(--imp);color:#2b1a00}
.tag--prop{background:var(--cov);color:#0b1626}
.is-new{outline:1.5px solid hsla(188,85%,58%,.8);outline-offset:2px}
.is-imp{outline:1.5px dashed hsla(40,100%,62%,.9);outline-offset:2px}
.ctag{position:absolute;top:-8px;right:12px;z-index:3;display:flex;gap:4px}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 0}
.frame-wrap{position:relative;flex:none}
.frame{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px var(--clr-border),0 10px 40px #000;background:#0c0b0a;font-size:14px}
.bg{position:absolute;inset:0;background:center/1280px 800px no-repeat}
svg.map{position:absolute;inset:0;width:1280px;height:800px}
svg.map .hit{cursor:pointer}
.hot{position:absolute;border-radius:50%;cursor:pointer}

.caption{height:178px;overflow:hidden;flex:none;width:min(1280px,calc(100vw - 32px));margin:0 auto 10px;background:var(--clr-bg-elevated);border:1px solid var(--clr-border-light);border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:center;align-content:start;box-shadow:0 8px 30px #000a}
.caption__meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--clr-text-secondary)}
.caption__meta b{font:700 12px var(--font-heading);letter-spacing:.1em;text-transform:uppercase;color:var(--clr-primary)}
.prog{display:flex;gap:3px;flex:1;max-width:420px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--clr-bg-panel);cursor:pointer}
.prog i.done{background:hsl(32,50%,32%)}.prog i.on{background:var(--clr-primary)}
.caption h2{margin:2px 0 0;font:700 19px var(--font-heading);letter-spacing:.03em}
.caption p{margin:2px 0 0;font-size:14px;line-height:1.45;color:var(--clr-text-primary);max-width:900px}
.caption .was{font-size:12.5px;color:var(--clr-text-secondary);margin-top:4px;display:flex;gap:8px;align-items:baseline}
.caption .was+.was{margin-top:2px}
.caption .off{font-size:12px;color:var(--imp);margin-top:4px}
.nav{grid-row:1 / span 4;grid-column:2;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.nav .row{display:flex;gap:6px}
.nav small{font-size:11px;color:var(--clr-text-muted);text-align:center}
.btn{background:linear-gradient(var(--clr-primary),var(--clr-primary-dark));color:#1a1108;font:700 13px var(--font-heading);letter-spacing:.06em;border:0;padding:0 14px;height:32px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn--ghost{background:var(--clr-bg-panel);color:var(--clr-text-primary);border:1px solid var(--clr-border-light)}
.btn--sm{height:26px;padding:0 10px;font-size:11.5px}
.btn[disabled]{opacity:.4;cursor:default}
.nav .btn{min-width:96px;height:38px;font-size:14px}

.explore{flex:none;width:min(1280px,calc(100vw - 32px));margin:0 auto 10px;background:var(--clr-bg-elevated);border:1px solid var(--clr-border-light);border-radius:12px;padding:10px 14px;display:none;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--clr-text-secondary)}
.explore b{font:700 12px var(--font-heading);letter-spacing:.1em;text-transform:uppercase;color:var(--clr-primary)}
.chip{background:var(--clr-bg-panel);border:1px solid var(--clr-border-light);color:var(--clr-text-primary);border-radius:14px;padding:4px 10px;font:600 12px var(--font-body);cursor:pointer}
.chip.on{border-color:var(--clr-primary);color:var(--clr-primary)}
body.is-explore .caption{display:none}
body.is-explore .explore{display:flex}

.spot{position:absolute;border-radius:12px;pointer-events:none;z-index:60;box-shadow:0 0 0 2px hsla(35,90%,85%,.85),0 0 0 3000px hsla(25,15%,3%,.6);transition:all .25s ease}
.spot::after{content:"";position:absolute;inset:-6px;border-radius:16px;border:2px solid hsla(35,95%,70%,.8);animation:spotPulse 1.6s ease-out infinite}
.ring{position:absolute;border-radius:50%;pointer-events:none;z-index:61;border:2px solid hsla(35,95%,70%,.9);animation:spotPulse 1.6s ease-out infinite}
@keyframes spotPulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.08);opacity:0}}
body.is-explore .spot,body.is-explore .ring,body.off-script .spot,body.off-script .ring{display:none}

.wm{position:absolute;top:60px;left:12px;width:220px;background:hsla(215,30%,10%,.94);border:1px solid var(--clr-border);border-radius:8px;padding:8px 12px;z-index:4;font-size:11px}
.wm__head{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--clr-text-muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.wm__sec{font:700 9px var(--font-body);letter-spacing:.12em;text-transform:uppercase;margin:6px 0 2px;display:flex;align-items:center;gap:5px}
.wm__sec--threat{color:var(--red)}.wm__sec--own{color:var(--clr-text-muted)}
.wm__empty{text-align:center;color:var(--clr-text-muted);padding:6px 0}
.wm__row{padding:6px 0;border-top:1px solid var(--clr-border);cursor:pointer}
.wm__sec+.wm__row{border-top:0}
.wm__top{display:flex;align-items:center;gap:6px;color:var(--clr-text-secondary)}
.wm__top span:last-child{margin-left:auto;color:var(--clr-text-muted)}
.wm__row--threat{background:hsla(0,60%,40%,.12);border-radius:5px;padding:6px;border-top:0;margin:2px -6px}
.wm__row--threat .wm__top{color:hsl(10,80%,72%)}.wm__row--threat .wm__top span:last-child{color:hsl(10,70%,66%);font-weight:700}
.wm__bar{height:3px;background:hsla(0,0%,100%,.12);border-radius:2px;margin-top:4px;overflow:hidden}
.wm__bar i{display:block;height:100%;background:#6bd4ff}
.wm__calm{display:flex;gap:6px;align-items:center;color:var(--clr-success);padding:4px 0}

.banner{position:absolute;left:50%;top:56px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;border-radius:20px;padding:5px 6px 5px 14px;font-size:13px;white-space:nowrap;z-index:5;cursor:pointer;background:hsla(0,45%,11%,.96);border:1px solid hsl(0,55%,40%);box-shadow:0 6px 20px #0009}
.banner b{font:700 13px var(--font-heading);letter-spacing:.06em;color:hsl(5,85%,64%)}
.banner .t{font:700 13px var(--font-display);color:#fff}
.banner--warn{background:hsla(48,40%,10%,.96);border-color:hsl(48,60%,35%)}.banner--warn b{color:var(--clr-warning)}

.focus{position:absolute;left:12px;top:600px;width:220px;background:hsla(215,30%,10%,.94);border:1px solid var(--clr-border);border-radius:8px;padding:8px 10px;z-index:4;font-size:11px;color:var(--clr-text-secondary);cursor:pointer}
.focus b{display:flex;align-items:center;gap:6px;color:var(--clr-text-primary);font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.switch{margin-left:auto;width:26px;height:14px;border-radius:7px;background:var(--clr-bg-panel);position:relative;border:1px solid var(--clr-border-light)}
.switch::after{content:"";position:absolute;top:1px;left:1px;width:10px;height:10px;border-radius:50%;background:var(--clr-text-muted)}
.switch.on{background:hsl(40,60%,25%)}.switch.on::after{left:13px;background:var(--imp)}

.tleg{position:absolute;right:12px;bottom:78px;width:176px;background:hsla(215,30%,10%,.96);border:1px solid var(--clr-border);border-radius:8px;padding:8px 12px;z-index:4;font-size:10px}
.tleg__head{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--clr-text-muted);margin-bottom:8px}
.tleg__row{display:flex;align-items:center;gap:8px;color:var(--clr-text-secondary);margin-bottom:6px}
.tleg__row--own{color:var(--clr-text-primary);font-weight:600}
.tleg__sw{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:0 0 6px 1px currentColor}

.more{position:absolute;right:12px;bottom:70px;width:224px;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;background:hsla(215,30%,11%,.97);border:1px solid hsl(215,20%,22%);border-radius:10px;z-index:20}
.more__t{position:relative;height:58px;border-radius:7px;background:hsla(215,25%,20%,.55);border:1px solid hsla(215,25%,30%,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--clr-text-secondary);font-size:12px;cursor:pointer}
.more__t .ic{width:20px;height:20px;color:hsl(215,10%,72%)}
.more__t--dis{opacity:.4;cursor:default}
.more__t .dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--clr-danger)}
.more__t .soon{position:absolute;top:5px;right:5px;font:700 8px var(--font-body);color:var(--clr-success);border:1px solid var(--clr-success);border-radius:6px;padding:1px 4px}
.more__t .tag{position:absolute;top:4px;left:5px}
.fabring{position:absolute;left:1219px;top:739px;width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 2px var(--clr-primary);z-index:21;pointer-events:none}

.acard{position:absolute;background:hsl(30,30%,11%);border:1px solid hsl(30,22%,22%);border-radius:12px;box-shadow:0 14px 40px #000c;z-index:12;font-size:12px}
.acard__stripe{height:4px;border-radius:12px 12px 0 0;background:var(--c)}
.acard__arrow{position:absolute;width:14px;height:14px;background:hsl(30,30%,11%);border:1px solid hsl(30,22%,22%);transform:rotate(45deg)}
.acard__arrow--down{bottom:-8px;border-top:0;border-left:0}
.acard__arrow--left{left:-8px;border-top:0;border-right:0}
.acard__arrow--right{right:-8px;border-bottom:0;border-left:0}
.acard__head{display:flex;gap:10px;align-items:center;padding:10px 12px 6px}
.acard__icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:hsl(30,15%,8%);border:2.5px solid var(--c);color:#fff;flex:none}
.acard__icon .ic{width:18px;height:18px}
.acard h3{margin:0;font:700 15px var(--font-display);letter-spacing:.02em}
.acard__sub{font-size:11px;color:var(--clr-text-muted)}
.acard__x{margin-left:auto;align-self:flex-start;background:none;border:0;color:var(--clr-text-muted);cursor:pointer;padding:2px}
.acard__body{padding:2px 12px 8px}
.acard__actions{display:flex;gap:6px;padding:4px 12px 12px}
.acard__actions button{flex:1;padding:8px 6px;border-radius:8px;border:1px solid var(--clr-border);background:hsl(30,32%,16%);color:var(--clr-text-primary);font:600 12px var(--font-body);cursor:pointer}
.acard__actions button.pri{border-color:hsla(10,90%,65%,.6)}
.acard__actions button[disabled]{opacity:.45;cursor:default}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--clr-text-secondary)}
.kv b{color:var(--clr-text-primary);font-weight:600;text-align:right}
.why{margin:6px 0;padding:6px 8px;border-left:3px solid var(--c,var(--red));background:hsla(0,0%,0%,.25);border-radius:0 5px 5px 0;color:var(--clr-text-secondary);line-height:1.4}
.why b{color:var(--clr-text-primary)}
.sect{position:relative;margin:8px 0 2px;padding:8px;border-radius:8px;background:hsla(0,0%,100%,.03)}
.sect__h{font:700 9.5px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--clr-text-muted);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.band{display:inline-flex;align-items:center;gap:4px;font:700 11px var(--font-body);padding:1px 7px;border-radius:10px;border:1px solid currentColor}
.band--g{color:var(--band-g)}.band--a{color:var(--band-a)}.band--r{color:var(--band-r)}
.stagebar{display:flex;gap:3px;margin:6px 0 2px}
.stagebar span{flex:1;text-align:center;font:600 9.5px var(--font-body);letter-spacing:.04em;padding:3px 0;border-radius:3px;background:var(--clr-bg-panel);color:var(--clr-text-muted)}
.stagebar span.done{color:var(--clr-text-secondary);background:hsl(0,15%,16%)}
.stagebar span.now{background:var(--red);color:#fff}
.meter{height:6px;border-radius:3px;background:hsla(0,0%,100%,.08);overflow:hidden;margin:4px 0}
.meter i{display:block;height:100%;background:var(--c,var(--clr-primary))}
.verdict{font:700 12px var(--font-heading);letter-spacing:.04em;padding:6px 8px;border-radius:5px;text-align:center;margin-top:6px}
.verdict--r{color:var(--band-r);background:hsl(0,30%,12%)}.verdict--a{color:var(--band-a);background:hsl(40,35%,11%)}.verdict--g{color:var(--band-g);background:hsl(90,25%,10%)}

.sheet{position:absolute;left:410px;bottom:77px;width:460px;background:hsl(30,30%,12%);border:1px solid var(--clr-border);border-radius:12px;box-shadow:0 12px 40px #000c;padding:16px;z-index:14}
.sheet__head{display:flex;align-items:center}
.sheet__head h3{margin:0;font:700 16px var(--font-display)}
.seg{display:flex;margin:14px 0 2px;border:1px solid var(--clr-border-light);border-radius:8px;position:relative}
.seg button:first-of-type{border-radius:7px 0 0 7px}.seg button:last-of-type{border-radius:0 7px 7px 0}
.seg button{flex:1;background:none;border:0;color:var(--clr-text-secondary);padding:7px;font:600 12px var(--font-body);cursor:pointer;text-align:left}
.seg button small{display:block;font-weight:400;font-size:10.5px;color:var(--clr-text-muted)}
.seg button.on{background:hsl(32,45%,20%);color:var(--clr-text-primary)}
.squad{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--clr-border);border-radius:8px;background:hsl(30,28%,15%);margin-top:6px;font-size:13px}
.squad b{font-weight:700}.squad small{margin-left:auto;font-size:11px;color:var(--clr-text-muted)}
.squad.sel{border-color:var(--clr-primary);background:hsl(32,50%,22%)}
.go{width:100%;padding:11px;border:0;border-radius:8px;background:hsl(80,55%,38%);color:#fff;font:700 14px var(--font-body);cursor:pointer;margin-top:10px}
.eta{font-size:11px;color:var(--clr-text-muted);margin-top:8px}

.toasts{position:absolute;top:60px;right:20px;width:300px;display:flex;flex-direction:column;gap:8px;z-index:30}
.toast{position:relative;display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:var(--clr-bg-elevated);border:1px solid var(--clr-border-light);box-shadow:0 8px 24px #000b}
.toast .ic{width:18px;height:18px;margin-top:1px}
.toast__t{font-weight:600;font-size:12.5px}.toast__m{font-size:11px;color:var(--clr-text-secondary);margin-top:2px}
.toast--ok{border-color:var(--clr-success)}.toast--ok .ic{color:var(--clr-success)}
.toast--bad{border-color:var(--clr-danger)}.toast--bad .ic{color:var(--clr-danger)}
.toast--mail{border-color:var(--clr-primary)}.toast--mail .ic{color:var(--clr-primary)}

.shade{position:absolute;inset:0;background:hsla(30,10%,3%,.7);z-index:40}
.modal{position:absolute;left:160px;top:80px;width:960px;height:640px;background:var(--clr-bg-surface);border:1px solid hsl(32,55%,35%);border-radius:14px;box-shadow:0 0 34px hsla(32,90%,55%,.18),0 20px 50px #000;z-index:41;display:flex;flex-direction:column;overflow:visible}
.modal__inner{display:flex;flex-direction:column;height:100%;border-radius:14px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-bottom:1px solid var(--clr-border);background:var(--clr-bg-elevated);flex:none}
.mhead h2{margin:0;font:700 18px var(--font-heading);letter-spacing:.08em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.mhead .muted{font-size:12px;color:var(--clr-text-secondary);flex:1}
.mx{width:32px;height:32px;border:1px solid var(--clr-border);border-radius:8px;background:var(--clr-bg-panel);color:var(--clr-text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mbody{flex:1;display:grid;grid-template-columns:230px 1fr;min-height:0}
.hub{padding:12px;border-right:1px solid var(--clr-border);background:var(--clr-bg-base);display:flex;flex-direction:column;gap:8px;overflow:visible}
.mt{position:relative;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border:1px solid var(--clr-border);border-radius:8px;background:var(--clr-bg-elevated);cursor:pointer}
.mt.on{border-color:var(--clr-primary);background:var(--clr-bg-active)}
.mt .ic{width:18px;height:18px}
.mt__name{font:700 14px var(--font-heading);letter-spacing:.06em;text-transform:uppercase;display:block}
.mt__meta{font-size:11.5px;color:var(--clr-text-secondary);white-space:nowrap}
.mt__bd{position:absolute;left:24px;top:6px;background:var(--clr-danger);color:#fff;font:700 10px var(--font-body);border-radius:8px;padding:1px 5px}
.mt .tag{position:absolute;top:-7px;right:10px}
.lhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--clr-border);font:700 14px var(--font-heading);letter-spacing:.08em;text-transform:uppercase;flex:none}
.lhead small{font:500 12px var(--font-body);letter-spacing:0;text-transform:none;color:var(--clr-text-muted)}
.list{flex:1;overflow:hidden;padding:8px;display:flex;flex-direction:column;gap:6px}
.col{display:flex;flex-direction:column;min-height:0}
.mr{position:relative;border:1px solid var(--clr-border);border-radius:8px;background:var(--clr-bg-elevated)}
.mr__top{display:grid;grid-template-columns:10px 22px 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;min-height:56px}
.mr__dot{width:7px;height:7px;border-radius:50%;background:var(--clr-primary)}.mr__dot.read{background:none}
.mr__top .ic{width:20px;height:20px}
.mr__subj{font-weight:700;font-size:13.5px}.mr__from{display:block;font-size:11px;color:var(--clr-text-muted)}
.mr__star{color:var(--clr-text-muted)}
.exp{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--font-body);color:var(--clr-warning);border:1px solid hsl(48,50%,30%);border-radius:10px;padding:2px 8px;white-space:nowrap}
.exp--dead{color:var(--clr-text-muted);border-color:var(--clr-border-light)}
.mr__x{padding:0 14px 12px 44px;font-size:13px;line-height:1.5;color:var(--clr-text-secondary)}
.letter{background:linear-gradient(hsl(35,20%,13%),hsl(35,15%,10%));border:1px solid hsl(35,20%,22%);border-radius:8px;padding:10px 14px;color:var(--clr-text-primary);font-size:13.5px}
.letter p{margin:0 0 6px}
.sig{font:700 12px var(--font-heading);letter-spacing:.06em;text-align:right;color:var(--c)}
.conseq{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.conseq div{background:var(--clr-bg-panel);border-radius:6px;padding:7px 10px;font-size:12px}
.conseq b{display:block;font:700 11px var(--font-heading);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.conseq .y b{color:var(--clr-success)}.conseq .n b{color:var(--clr-danger)}
.mr__btns{display:flex;gap:8px;align-items:center}

.fd{padding:14px 16px;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.fhead{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center}
.portrait{width:56px;height:56px;border-radius:12px;border:2.5px solid var(--c);display:flex;align-items:center;justify-content:center;background:hsl(30,15%,8%);color:#fff}
.portrait .ic{width:26px;height:26px}
.fname{font:700 19px var(--font-heading);letter-spacing:.06em}
.muted{color:var(--clr-text-muted);font-size:12px}
.quote{font-style:italic;color:var(--clr-text-secondary);font-size:12.5px;margin-top:2px}
.ptag{font:600 10px var(--font-body);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--clr-border-light);color:var(--clr-text-secondary);padding:2px 7px;border-radius:3px;white-space:nowrap}
.card{position:relative;background:var(--clr-bg-elevated);border:1px solid var(--clr-border);border-radius:8px;padding:10px 12px}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;min-height:0}
.lbl{font:700 10px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--clr-text-muted);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.standbar{position:relative;height:9px;border-radius:5px;margin:8px 0 3px;background:linear-gradient(90deg,hsl(0,70%,48%) 0 20%,hsl(20,60%,42%) 20% 40%,hsl(35,8%,45%) 40% 60%,hsl(100,30%,40%) 60% 80%,var(--clr-success) 80%)}
.standbar u{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 0 2px #000}
.bands{display:flex;justify-content:space-between;font:600 9px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--clr-text-muted)}
.mod{display:grid;grid-template-columns:36px 1fr auto;gap:8px;font-size:12px;padding:5px 4px;border-top:1px solid var(--clr-border);align-items:center}
.mod .v{font:700 13px var(--font-heading);text-align:right}.mod .v.p{color:var(--clr-success)}.mod .v.n{color:var(--clr-danger)}
.mod small{color:var(--clr-text-muted);font-size:11px;white-space:nowrap}
.mod--new{background:hsla(32,80%,50%,.14);border-radius:4px}
.pips{display:flex;gap:4px;margin-top:4px}.pips i{flex:1;height:7px;border-radius:2px;background:var(--clr-bg-panel)}.pips i.on{background:var(--clr-warning)}
.dip{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--clr-border);font-size:12px}
.dip:first-of-type{border-top:0}
.dip small{display:block;color:var(--clr-text-muted);font-size:11px}
.ftile .ic{width:20px;height:20px}
.ftile__st{display:block;font-size:11px;color:var(--clr-text-secondary);line-height:1.3}
.hubsec{font:700 9.5px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--clr-text-muted);margin:6px 2px 0}

.wb{position:absolute;left:400px;top:92px;width:480px;background:var(--clr-bg-surface);border:1px solid var(--clr-border-light);border-radius:14px;z-index:41;box-shadow:0 20px 60px #000}
.wb__h{padding:16px 18px 10px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--clr-border)}
.wb__h .ic{width:30px;height:30px;color:var(--clr-primary)}
.wb__title{font:700 20px var(--font-display)}
.wb__sub{font-size:12px;color:var(--clr-text-secondary)}
.wb__sec{padding:8px 18px}
.wb__st{font:700 10px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--clr-text-muted);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.wb__ln{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:5px 0;font-size:12.5px;line-height:1.4}
.wb__ln .ic{margin-top:1px}
.wb__ln em{display:block;font-style:normal;color:var(--clr-text-muted);font-size:11px}
.wb__threat{margin:4px 0;background:hsl(0,35%,10%);border:1px solid hsl(0,45%,30%);border-radius:8px;padding:10px 12px}
.wb__count{font:700 22px var(--font-display);color:hsl(5,85%,64%)}
.res{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--clr-text-secondary)}
.res b{color:var(--clr-success);font-weight:600}
.wb__act{display:flex;gap:8px;padding:12px 18px 16px}

.result{position:absolute;left:470px;top:150px;width:340px;background:hsl(30,30%,11%);border:1px solid hsl(90,35%,32%);border-radius:12px;box-shadow:0 16px 50px #000;z-index:13;overflow:visible}
.result__h{padding:14px;text-align:center;border-bottom:1px solid var(--clr-border)}
.result__h .ic{width:30px;height:30px;color:var(--clr-success)}
.result__t{font:700 18px var(--font-display);color:var(--clr-success);margin-top:4px}
.result__body{padding:8px 14px 4px;font-size:12px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin:4px 0 8px}
.vs b{display:block;font:700 15px var(--font-heading)}
.vs small{color:var(--clr-text-muted);font-size:11px}

.toast__btn{margin-top:6px}
.fabpulse{position:absolute;left:1213px;top:733px;width:60px;height:60px;border-radius:50%;border:2px solid var(--clr-danger);z-index:21;pointer-events:none;animation:spotPulse 1.6s ease-out infinite}
.fabtag{position:absolute;left:1196px;top:716px;z-index:22}
.learned{position:absolute;left:12px;top:250px;width:220px;background:hsla(0,30%,10%,.95);border:1px solid hsl(0,40%,30%);border-radius:8px;padding:9px 11px;z-index:4;font-size:11px;color:var(--clr-text-secondary)}

.learned p{margin:6px 0 0;line-height:1.4}

.rp__bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--clr-text-secondary);margin-bottom:8px}
.tierpips{display:inline-flex;gap:3px;vertical-align:middle}.tierpips i{width:14px;height:6px;border-radius:2px;background:var(--clr-bg-panel)}.tierpips i.on{background:var(--clr-warning)}
.agechip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--clr-border-light);border-radius:10px;padding:1px 8px}
.agechip--stale{color:var(--clr-warning);border-color:hsl(48,50%,30%)}
.rtabs{display:flex;gap:2px;border-bottom:1px solid var(--clr-border);margin-bottom:10px}
.rtab{background:none;border:0;border-bottom:2px solid transparent;color:var(--clr-text-secondary);padding:7px 12px;font:600 12px var(--font-body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}

.hero{background:var(--clr-bg-panel);border:1px solid var(--clr-border);border-radius:8px;padding:8px;display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;position:relative}
.hero__pt{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--rc);background:hsl(30,15%,8%)}

.hero b{display:block;font-size:12.5px}.hero small{display:block;font-size:10.5px;color:var(--clr-text-muted)}
.hero .stars{color:var(--clr-warning);font-size:10px;letter-spacing:1px}
.hero .sk{grid-column:1 / -1;font-size:10.5px;color:var(--clr-text-secondary);border-top:1px solid var(--clr-border);padding-top:4px}
.locked{display:flex;align-items:center;gap:6px;color:var(--clr-text-muted);font-size:11px;font-style:italic}
.locked .ic{width:12px;height:12px}
.hero--locked{justify-content:center;display:flex;text-align:center}
.sqt{width:100%;border-collapse:collapse;margin-bottom:8px}
.sqt th{font:700 9.5px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--clr-text-muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--clr-border)}
.sqt td{padding:5px 6px;border-bottom:1px solid var(--clr-border);vertical-align:top}
.sqt td small{display:block;color:var(--clr-text-muted);font-size:10.5px}
.sqt .row{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--clr-text-secondary);width:52px}
.sqhead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 2px}
.sqhead b{font:700 13px var(--font-heading);letter-spacing:.04em}
.typ{display:inline-block;font:700 9px var(--font-body);letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.typ--cav{background:hsl(30,40%,22%);color:hsl(30,80%,70%)}.typ--inf{background:hsl(210,25%,22%);color:hsl(210,60%,75%)}.typ--rng{background:hsl(120,20%,20%);color:hsl(110,45%,65%)}.typ--sie{background:hsl(0,0%,22%);color:#ccc}

.lv{display:flex;gap:2px}.lv i{width:9px;height:9px;border-radius:2px;background:var(--clr-bg-panel)}.lv i.on{background:var(--clr-primary)}
.blur{filter:blur(3px);opacity:.5;pointer-events:none;user-select:none}

<script>
const RED = '#e05a3d', SCAV = '#b7d645', YOU = '#3ad17a', COV = '#6f9fd8', REBEL = '#b07ad8', WARN = 'hsl(48,95%,52%)', NEWC = 'hsl(188,85%,58%)';
const $ = id => document.getElementById(id);
const I = (n, style = '') => `<svg class="ic" style="${style}"><use href="#i-${n}"/></svg>`;
const NEW = '<span class="tag tag--new">NEW</span>';
const IMP = '<span class="tag tag--imp">IMPROVED</span>';
const PROP = '<span class="tag tag--prop">PROPOSAL</span>';

const P = {
  hold: [940, 726], camp: [812, 728], den: [378, 235], keep: [915, 245], rebel: [680, 462],
  outpost: [403, 655], fort: [644, 610], meet: [752, 684],
};
const ROUTES = {
  scouts: [[918, 722], [870, 700], [790, 706], [754, 676], [752, 660], [752, 650], [752, 640]],
  column: [[916, 726], [890, 727], [860, 728], [832, 728]],
  warband: [[796, 718], [772, 712], [754, 700], [752, 676], [752, 652], [722, 624], [664, 614]],
  intercept: [[420, 660], [520, 720], [660, 712], [734, 686]],
  reinforce: [[420, 648], [500, 590], [580, 584], [626, 604]],
  scoutRun: [[420, 664], [600, 690], [800, 726], [914, 730]],
  retreat: [[760, 690], [790, 716], [840, 726], [906, 726]],
};

function bez(pts) {
  const [a, b, c, d] = pts;
  return { d: `M${a} C${b} ${c} ${d}`, at: t => { const u = 1 - t; return [0, 1].map(k => u * u * u * a[k] + 3 * u * u * t * b[k] + 3 * u * t * t * c[k] + t * t * t * d[k]); } };
}
function chain(pts) {
  if (pts.length === 4) return bez(pts);
  const segs = [bez(pts.slice(0, 4)), bez(pts.slice(3, 7))];
  return { d: segs[0].d + ' ' + segs[1].d.replace(/^M[^C]+/, ''), at: t => t < .5 ? segs[0].at(t * 2) : segs[1].at(t * 2 - 1) };
}
function pathFor(key) { const p = ROUTES[key]; return p.length === 7 ? chain(p) : p.length === 4 ? bez(p) : bez([p[0], p[1], p[2], p[3]]); }

function mapNode({ p, r = 20, color, icon, lvl, faded, act, label, label2, isNew = true, prop }) {
  const [x, y] = p;
  const op = faded ? .62 : 1;
  const ring = faded ? `stroke-dasharray="5 3"` : '';
  const lbl = label ? textLabel(x, y + r + 15, label, label2, isNew, prop, color) : '';
  return `<g class="hit" data-act="${act}" opacity="${op}">
    ${isNew ? `<circle cx="${x}" cy="${y}" r="${r + 5}" fill="none" stroke="${NEWC}" stroke-width="1.5" opacity=".85"/>` : ''}
    <circle cx="${x}" cy="${y}" r="${r}" fill="hsl(30,12%,9%)" stroke="${color}" stroke-width="3.5" ${ring}/>
    <use href="#i-${icon}" x="${x - r * .55}" y="${y - r * .55}" width="${r * 1.1}" height="${r * 1.1}" style="color:#fff"/>
    ${lvl ? `<g transform="translate(${x - r * .82} ${y - r * .82}) rotate(45)"><rect x="-9" y="-9" width="18" height="18" rx="2" fill="${color}" stroke="#0008"/></g>
    <text x="${x - r * .82}" y="${y - r * .82 + 4.5}" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="12" fill="#fff">${lvl}</text>
    <rect x="${x - r * .82 + 11}" y="${y - r - 2}" width="24" height="3" rx="1" fill="#3ad17a"/>` : ''}
  </g>${lbl}`;
}
function textLabel(x, y, t, t2, isNew, prop, color) {
  const w = t.length * 6.6 + 10, tag = isNew ? (prop ? 'PROPOSAL' : 'NEW') : '';
  const tw = tag ? tag.length * 6 + 8 : 0;
  const total = w + (tag ? tw + 4 : 0), x0 = x - total / 2;
  return `<g pointer-events="none">
    <text x="${x0 + w / 2}" y="${y}" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="11" letter-spacing=".4" fill="#fff" stroke="#000" stroke-width="3.2" paint-order="stroke">${t}</text>
    ${tag ? `<rect x="${x0 + w + 4}" y="${y - 10}" width="${tw}" height="13" rx="3" fill="${prop ? COV : NEWC}"/><text x="${x0 + w + 4 + tw / 2}" y="${y - 0.5}" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="8.5" letter-spacing=".8" fill="#03222a">${tag}</text>` : ''}
    ${t2 ? `<text x="${x}" y="${y + 13}" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="10" fill="${color}" stroke="#000" stroke-width="3" paint-order="stroke">${t2}</text>` : ''}
  </g>`;
}
function pill(x, y, text, color, opts = {}) {
  const w = text.length * 6.4 + 14;
  return `<g ${opts.act ? `class="hit" data-act="${opts.act}"` : 'pointer-events="none"'}><rect x="${x - w / 2}" y="${y - 10}" width="${w}" height="19" rx="9.5" fill="hsla(20,20%,6%,.92)" stroke="${color}" stroke-width="1.2"/>
    <text x="${x}" y="${y + 3.8}" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="10.5" letter-spacing=".3" fill="${color}">${text}</text></g>`;
}
function mover(p, color, act) {
  return `<g class="hit" data-act="${act}"><circle cx="${p[0]}" cy="${p[1]}" r="13" fill="${color}" opacity=".28"><animate attributeName="r" values="9;15;9" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="${p[0]}" cy="${p[1]}" r="6.5" fill="${color}" stroke="#000" stroke-width="2"/></g>`;
}
function route(key, color, kind, arrow) {
  const c = pathFor(key);
  const dash = kind === 'dot' ? 'stroke-dasharray="1.5 6" stroke-linecap="round" stroke-width="3.2"' : 'stroke-dasharray="8 6" stroke-width="3"';
  return { c, svg: `<path d="${c.d}" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="6" stroke-linecap="round"/>
    <path d="${c.d}" fill="none" stroke="${color}" ${dash} ${arrow ? `marker-end="url(#${arrow})"` : ''}><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.4s" repeatCount="indefinite"/></path>` };
}

const STAGES_LIVE = ['probe', 'mass', 'march'];
function drawMap(s) {
  $('bg').style.backgroundImage = `url(${s.bg === 'today' ? 'bg-world-today.jpg' : 'bg-world-held.jpg'})`;
  const fog = s.bg === 'today';
  const maskFill = fog ? 'rgb(21,16,13)' : 'rgb(75,52,44)';
  const maskLine = fog ? 'rgb(23,18,15)' : 'rgb(79,56,48)';
  let o = `<defs>
    <marker id="aR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${RED}"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${YOU}"/></marker>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="${maskFill}"/><rect y="2" width="4" height="1" fill="${maskLine}"/></pattern>
    <mask id="veilMask"><rect width="1280" height="800" fill="#fff"/>
      <circle cx="${P.outpost[0]}" cy="${P.outpost[1]}" r="20" fill="#000"/>
      ${s.stage !== 'lost' ? `<circle cx="${P.fort[0]}" cy="${P.fort[1]}" r="19" fill="#000"/>` : ''}
      <rect x="518" y="728" width="246" height="72" fill="#000"/></mask>
  </defs>`;
  o += `<rect x="868" y="680" width="132" height="92" fill="url(#scan)"/>`;

  const live = STAGES_LIVE.includes(s.stage) || s.stage === 'battle';
  if (s.focus && live) o += `<rect x="280" y="50" width="720" height="723" fill="hsla(25,20%,4%,.58)" mask="url(#veilMask)" pointer-events="none"/>`;

  if (s.proposal) o += `<rect x="523" y="56" width="474" height="234" rx="4" fill="hsla(212,55%,64%,.07)" stroke="${COV}" stroke-width="2" stroke-dasharray="8 6" pointer-events="none"/>` + pill(660, 290, 'PROPOSED · IRON COVENANT REGIONS', COV);

  o += `<rect class="hit" data-act="card:region" x="521" y="534" width="238" height="194" fill="transparent"/>`;

  const regionPill = { probe: ['WATCHED BY RED TALON SCOUTS', WARN], mass: ['TARGET · RED TALON MASSING', RED], march: ['WARBAND INBOUND · 18:40', RED] }[s.stage];
  if (regionPill) {
    const col = regionPill[1];
    o += `<rect x="522" y="535" width="236" height="236" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="${s.stage === 'probe' ? '7 6' : '0'}" pointer-events="none"/>` + pill(615, 517, regionPill[0], col, { act: 'card:region' });
  }
  if (live || s.stage === 'after') o += `<circle cx="${P.fort[0]}" cy="${P.fort[1]}" r="20" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3" pointer-events="none"/>` + textLabel(P.fort[0], P.fort[1] - 26, 'REAVER FORT', '', false);

  o += mapNode({ p: P.den, r: 19, color: SCAV, icon: 'skull', lvl: 7, faded: true, act: 'card:den', label: 'SCAVENGER DEN', label2: 'seen through fog' });
  o += mapNode({ p: P.keep, r: 19, color: COV, icon: 'shield', lvl: 9, faded: true, act: 'card:keep', label: 'COVENANT KEEP', label2: 'seen through fog', prop: true });
  if (s.rebels) o += mapNode({ p: P.rebel, r: 16, color: REBEL, icon: 'fire', lvl: 2, act: 'card:rebel', label: 'ASH BROOD', label2: 'rebel camp · 1 of 3' });

  if (s.stage === 'probe') {
    const r = route('scouts', WARN, 'dot');
    o += r.svg + mover(ROUTES.scouts[6], WARN, 'card:scouts') + pill(ROUTES.scouts[6][0] - 2, ROUTES.scouts[6][1] - 24, 'SCOUTS', WARN, { act: 'card:scouts' });
  }
  if (s.stage === 'mass') {
    const r = route('column', RED, 'dash');
    o += r.svg + mover(r.c.at(.45), RED, 'card:column');
  }
  if (s.stage === 'mass' || s.stage === 'march') {
    const C = 2 * Math.PI * 21, f = s.stage === 'mass' ? .62 : .03;
    o += `<g class="hit" data-act="card:camp">
      <circle cx="${P.camp[0]}" cy="${P.camp[1]}" r="26" fill="none" stroke="${NEWC}" stroke-width="1.5" opacity=".85"/>
      <circle cx="${P.camp[0]}" cy="${P.camp[1]}" r="21" fill="hsl(0,25%,9%)" stroke="hsla(8,70%,50%,.3)" stroke-width="5"/>
      <circle cx="${P.camp[0]}" cy="${P.camp[1]}" r="21" fill="none" stroke="${RED}" stroke-width="5" stroke-dasharray="${C * f} ${C}" transform="rotate(-90 ${P.camp[0]} ${P.camp[1]})"/>
      <use href="#i-sword" x="${P.camp[0] - 10}" y="${P.camp[1] - 10}" width="20" height="20" style="color:#fff"/></g>`;
    o += textLabel(P.camp[0], P.camp[1] + 38, 'WAR CAMP', s.stage === 'mass' ? `62% · departs ${s.count}` : 'empty · warband left', true, false, RED);
  }
  if (s.stage === 'march') {
    const w = route('warband', RED, 'dash', 'aR');
    const wp = w.c.at(.2);
    o += w.svg + mover(wp, RED, 'card:warband') + pill(wp[0] + 58, wp[1] - 16, 'WARBAND 18:40', RED, { act: 'card:warband' });
    if (s.sent) {
      const k = s.sent === 'intercept' ? 'intercept' : 'reinforce';
      const g = route(k, YOU, 'dash', 'aG');
      const gp = g.c.at(.5);
      o += g.svg + mover(gp, YOU, 'card:squad') + pill(gp[0], gp[1] + 22, s.sent === 'intercept' ? 'SQUAD 1 → MEETING POINT · 4:10 AHEAD' : 'SQUAD 1 → REAVER FORT · 6:20', YOU, { act: 'card:squad' });
      if (k === 'intercept') o += `<circle cx="${P.meet[0]}" cy="${P.meet[1]}" r="11" fill="hsla(140,60%,50%,.15)" stroke="${YOU}" stroke-width="2" stroke-dasharray="3 3" pointer-events="none"/>`;
    }
  }
  if (s.stage === 'battle') {
    o += `<g pointer-events="none"><circle cx="${P.meet[0]}" cy="${P.meet[1]}" r="20" fill="hsla(90,45%,48%,.25)" stroke="${YOU}" stroke-width="3"/><use href="#i-shield" x="${P.meet[0] - 10}" y="${P.meet[1] - 10}" width="20" height="20" style="color:#fff"/></g>`;
  }
  if (s.stage === 'after') {
    const r = route('retreat', RED, 'dot', 'aR');
    o += r.svg + mover(r.c.at(.55), RED, 'card:retreat') + pill(860, 700, 'SURVIVORS RETREATING', RED, { act: 'card:retreat' });
  }

  if (s.scoutSent) {
    const r = route('scoutRun', YOU, 'dot', 'aG');
    const sp = r.c.at(.55);
    o += r.svg + mover(sp, YOU, 'card:hold') + pill(sp[0], sp[1] - 22, 'YOUR SCOUT · 3:20', YOU, { act: 'card:hold' });
  }
  const holdOpts = { p: P.hold, r: 22, color: RED, icon: 'fire', lvl: 9, act: 'card:hold', label: 'RED TALON HOLD' };
  if (s.stage === 'lost') Object.assign(holdOpts, { faded: true, label2: 'seen through fog' });
  o += mapNode(holdOpts);

  if (s.stage === 'lost') {
    o += pill(615, 517, 'LOST · BUFF GONE', RED) + pill(880, 517, 'FOGGED AGAIN · CASCADE', 'hsl(35,10%,72%)');
    o += `<rect x="522" y="535" width="236" height="236" fill="none" stroke="${RED}" stroke-width="2.5" pointer-events="none"/>`;
  }
  $('map').innerHTML = o;
}

function marchesPanel(s) {
  const threats = [], own = [];
  if (s.stage === 'probe') threats.push({ act: 'card:scouts', icon: 'search', n: 'Red Talon scouts', t: 'watching', pct: 100, c: WARN });
  if (s.stage === 'mass') threats.push({ act: 'card:camp', icon: 'sword', n: 'Massing → Red Lowlands', t: s.count, pct: 62, c: RED });
  if (s.stage === 'march') threats.push({ act: 'card:warband', icon: 'sword', n: 'Warband → Red Lowlands', t: '18:40', pct: 42, c: RED });
  if (s.scoutSent) own.push({ act: 'card:hold', icon: 'search', n: 'Scout → Red Talon Hold', t: '3:20', pct: 35 });

  }
  return h + '</div>';
}

const PRESET_TITLES = [['Calm', 'You hold Red Lowlands'], ['Scout report', 'The report: overview'], ['Probe', 'Scouts are watching'], ['Massing', 'A war camp forms'], ['March', 'The warband moves'], ['Squad out', 'Your squad heads out'], ['Held', 'Held'], ['Aftermath', '"This isn\'t over."'], ['Lost', 'If nobody defends'], ['Offline return', 'Strikes wait for you'], ['Defend now', 'Choice 1: Defend now'], ['Continue', 'Choice 2: Continue'], ['Rebels', 'Ash Brood']];
const EXPLORE_PRESETS = PRESET_TITLES.map(([n, t]) => [n, STEPS.findIndex(st => st.title === t)]);
const REPORT_IDX = STEPS.findIndex(st => st.title === 'The report: overview');

let idx = 0, mode = 'guided', state = null, offScript = false, presetIdx = 0;
const stepState = i => Object.assign(structuredClone(DEFAULTS), { scoutReport: i >= REPORT_IDX }, structuredClone(STEPS[i].st));

function render() {
  const s = state;
  drawMap(s);
  if (s.view === 'base') { $('bg').style.backgroundImage = 'url(01-city-base-view.jpg)'; $('map').innerHTML = ''; $('hud').innerHTML = banner(s) + baseHud(s); }
  else $('hud').innerHTML = marchesPanel(s) + banner(s) + focusChip(s) + terrLegend() + learnedCard(s);
  let layer = card(s) + sheet(s) + result(s) + (s.more ? moreGrid(s) : '') + toasts(s);
  if (s.modal === 'mail') layer += mailModal(s);
  if (s.modal === 'factions') layer += factionsModal(s);
  if (s.modal === 'welcome') layer += welcome();
  $('layer').innerHTML = layer;
  document.body.classList.toggle('off-script', offScript);
  renderCaption();
  renderExplore();
  placeSpot();
}

function frameRect(el) {
  const f = $('frame').getBoundingClientRect(), r = el.getBoundingClientRect(), k = scale;
  return [(r.left - f.left) / k, (r.top - f.top) / k, r.width / k, r.height / k];
}
function placeSpot() {
  const step = STEPS[idx], spot = $('spot');
  $('rings').innerHTML = '';
  if (mode !== 'guided' || offScript || !step.spot) { spot.style.display = 'none'; return; }
  let r = step.spot.rect;
  if (step.spot.sel) { const el = document.querySelector(step.spot.sel); if (el) { r = frameRect(el); const p = step.spot.pad ?? 8; r = [r[0] - p, r[1] - p, r[2] + p * 2, r[3] + p * 2]; } }
  if (r && step.spot.include) { const [a, b, c, d] = step.spot.include; const x1 = Math.min(r[0], a), y1 = Math.min(r[1], b), x2 = Math.max(r[0] + r[2], c), y2 = Math.max(r[1] + r[3], d); r = [x1, y1, x2 - x1, y2 - y1]; }
  if (!r) { spot.style.display = 'none'; return; }
  Object.assign(spot.style, { display: 'block', left: r[0] + 'px', top: r[1] + 'px', width: r[2] + 'px', height: r[3] + 'px' });
  $('rings').innerHTML = (step.rings || []).map(([p, rad]) => `<div class="ring" style="left:${p[0] - rad}px;top:${p[1] - rad}px;width:${rad * 2}px;height:${rad * 2}px"></div>`).join('');
}

function renderCaption() {
  const st = STEPS[idx];
  const was = (st.was || []).map(([k, t]) => `<div class="was"><span class="tag ${k === 'PROPOSAL' ? 'tag--prop' : 'tag--imp'}">${k}</span><span>${t}</span></div>`).join('');
  $('caption').innerHTML = `<div class="caption__meta"><b>Step ${idx + 1} of ${STEPS.length} · ${st.tag}</b><div class="prog">${STEPS.map((_, i) => `<i class="${i < idx ? 'done' : i === idx ? 'on' : ''}" data-go="${i}" title="Step ${i + 1}: ${STEPS[i].title}"></i>`).join('')}</div></div>
    <h2>${st.title}</h2><p>${st.text}</p>${was}${offScript ? '<div class="off">You clicked off-script. Next or Back returns to the story.</div>' : ''}
    <div class="nav"><div class="row"><button class="btn btn--ghost" id="back" ${idx === 0 ? 'disabled' : ''}>Back</button><button class="btn" id="next" ${idx === STEPS.length - 1 ? 'disabled' : ''}>Next</button></div><small>or use ← → keys</small></div>`;
}
function renderExplore() {

}

function goStep(i) { idx = Math.max(0, Math.min(STEPS.length - 1, i)); state = stepState(idx); offScript = false; render(); }
function setMode(m) {
  mode = m; document.body.classList.toggle('is-explore', m === 'explore');
  $('mGuided').classList.toggle('on', m === 'guided'); $('mExplore').classList.toggle('on', m === 'explore');
  if (m === 'guided') { offScript = false; state = stepState(idx); }
  else { const k = EXPLORE_PRESETS.reduce((best, [, i], j) => i <= idx ? j : best, 0); presetIdx = k; }
  fit(); render();
}

function act(a) {
  const s = state;
  const [k, v] = a.split(':');
  if (k === 'noop') return false;
  if (k === 'close') { s.card = null; s.sheet = null; s.modal = null; s.more = false; s.toasts = []; return true; }
  if (k === 'card') { s.view = 'world'; s.card = v; s.sheet = null; s.more = false; s.modal = null; if (v === 'rebel') s.rebels = true; return true; }
  if (k === 'sheet') { s.view = 'world'; s.sheet = v; s.card = null; s.modal = null; if (v !== 'scout' && s.stage !== 'march') { s.stage = 'march'; s.bg = 'held'; } return true; }
  if (k === 'march' && s.sheet === 'scout') { s.scoutSent = true; s.scoutReport = true; s.reportAge = 'just now'; s.sheet = null; s.toasts = [{ k: 'mail', icon: 'search', t: 'Scout party sent', m: 'The report lands in Mail → Reports', isNew: true, act: 'report', btn: 'Open report' }]; return true; }
  if (k === 'march') { s.sent = s.sheet; s.sheet = null; s.card = null; return true; }
  if (k === 'more') { s.more = !s.more; s.card = null; return true; }
  if (k === 'factions') { s.modal = 'factions'; s.facTab = 'red'; s.more = false; s.card = null; return true; }
  if (k === 'tab') { s.modal = 'factions'; s.facTab = v; s.card = null; return true; }
  if (k === 'events') { s.more = false; s.toasts = [{ k: 'mail', icon: 'lightning', t: 'Events view', m: 'Covered by prototype B (events).', isNew: false }]; return true; }
  if (k === 'mail') { s.modal = 'mail'; s.mailCat = 'diplomacy'; s.card = null; s.more = false; s.sheet = null; return true; }
  if (k === 'cat') { s.mailCat = v; return true; }
  if (k === 'row') { s.mailRow = s.mailRow === v ? null : v; return true; }
  if (k === 'focus') { s.focus = !s.focus; return true; }
  if (k === 'defend') { s.modal = null; s.view = 'world'; s.card = 'region'; s.toasts = []; if (s.count === '0:45:00') s.count = '0:44:58'; return true; }
  if (k === 'continue') { s.modal = null; s.view = 'base'; s.toasts = [CONTINUE_TOAST]; return true; }
  if (k === 'report') { s.modal = 'mail'; s.mailCat = 'reports'; s.mailRow = 'scout'; s.scoutTab = 'overview'; s.card = null; s.sheet = null; s.toasts = []; return true; }
  if (k === 'stab') { s.scoutTab = v; return true; }
  if (k === 't3') { s.scoutT3 = !s.scoutT3; return true; }
  if (k === 'flip') { s.view = s.view === 'base' ? 'world' : 'base'; s.card = null; s.sheet = null; s.more = false; return true; }
  return false;
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) return goStep(+go.dataset.go);
  if (e.target.closest('#next')) return goStep(idx + 1);
  if (e.target.closest('#back')) return goStep(idx - 1);
  const pr = e.target.closest('[data-preset]');
  if (pr) { presetIdx = +pr.dataset.preset; idx = EXPLORE_PRESETS[presetIdx][1]; state = stepState(idx); state.card = state.card === 'rebel' ? null : state.card; return render(); }
  const el = e.target.closest('[data-act]');
  if (!el || !$('frame').contains(el)) return;
  if (act(el.dataset.act)) { if (mode === 'guided') offScript = true; render(); }
});
document.addEventListener('keydown', e => {
  if (mode !== 'guided') return;
  if (e.key === 'ArrowRight') goStep(idx + 1);
  if (e.key === 'ArrowLeft') goStep(idx - 1);
});
$('mGuided').onclick = () => setMode('guided');
$('mExplore').onclick = () => setMode('explore');

let scale = 1;
function fit() {
  const top = document.querySelector('.top').offsetHeight;
  const cap = mode === 'guided' ? 188 : $('explore').offsetHeight + 10;
  const availH = window.innerHeight - top - cap - 16, availW = window.innerWidth - 32;
  scale = Math.min(availW / 1280, availH / 800, 1.25);
  $('frame').style.transform = `scale(${scale})`;
  $('wrap').style.width = 1280 * scale + 'px';
  $('wrap').style.height = 800 * scale + 'px';
}
window.addEventListener('resize', () => { fit(); placeSpot(); });
