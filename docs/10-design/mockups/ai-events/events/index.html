<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basie Events Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Oswald:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:hsl(30,10%,5%);--bg-surface:hsl(30,9%,8%);--bg-elev:hsl(30,8%,11%);--bg-panel:hsl(30,8%,14%);
  --border:hsl(30,10%,18%);--border-l:hsl(30,10%,27%);
  --primary:hsl(32,90%,55%);--primary-d:hsl(30,88%,40%);--success:hsl(90,45%,48%);--warning:hsl(48,95%,52%);--danger:hsl(0,85%,58%);
  --tx1:hsl(35,15%,93%);--tx2:hsl(35,10%,62%);--tx3:hsl(35,8%,42%);
  --f-head:'Oswald',sans-serif;--f-body:'Outfit',sans-serif;--f-disp:'Orbitron',sans-serif;
  --me:#3ad17a;--red:#e05a3d;--scav:#b7d645;--iron:#6f9fd8;--rebel:#9b6bff;--storm:#7fb2e6;--contam:#e0559b;--neutral:#e2cf9f;
  --world:hsl(200,45%,62%);--mile:#e2c36b;
  --new:#22d3ee;--imp:#ffb627;
  --page:#0d0c0a;
}
*{box-sizing:border-box}
html,body{margin:0;background:#070605;color:var(--tx1);font-family:var(--f-body);overflow:hidden;height:100%}
button{font-family:inherit;cursor:pointer}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}

#proto{min-height:52px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 16px;background:#0b0a09;border-bottom:1px solid #1f1c19}
#proto h1{font:700 15px var(--f-head);letter-spacing:.06em;margin:0;text-transform:uppercase;white-space:nowrap}
#proto h1 small{font:500 12px var(--f-body);color:var(--tx3);letter-spacing:0;text-transform:none;margin-left:8px}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--tx2);white-space:nowrap}
.legend .sw{display:inline-flex;align-items:center;gap:6px}
.week{display:flex;gap:3px;margin-left:auto}
.week span{font:600 11px var(--f-head);letter-spacing:.05em;color:var(--tx3);padding:4px 7px;border-radius:5px;border:1px solid #221f1b;text-transform:uppercase}
.week span.on{color:#111;background:var(--primary);border-color:var(--primary)}
.week span.span{color:var(--tx1);border-color:var(--primary)}
.seg{display:flex;border:1px solid var(--border-l);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--tx2);font:600 12px var(--f-body);padding:6px 12px}
.seg button.on{background:var(--primary);color:#16110a}
.chk{font-size:12px;color:var(--tx2);display:flex;gap:6px;align-items:center;white-space:nowrap}

#stage{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:10px}
#frameWrap{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px #2a2622,0 20px 60px rgba(0,0,0,.6)}
#frame{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;background:var(--page)}

#caption{margin-top:10px;width:1280px;max-width:calc(100vw - 24px);display:flex;gap:18px;align-items:stretch;background:linear-gradient(180deg,#191512,#120f0d);border:1px solid #3a2e22;border-radius:12px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#caption .meta{flex:none;width:210px;border-right:1px solid #2c241d;padding-right:14px;display:flex;flex-direction:column;gap:6px}
#capStep{font:700 12px var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
#capTopic{font:600 19px var(--f-head);line-height:1.15}
#capDay{font-size:12px;color:var(--tx3)}
#capText{flex:1;font-size:15px;line-height:1.5;color:var(--tx1)}
#capText b{color:#fff}
#capLook{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.look{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid;display:inline-flex;gap:5px;align-items:center}
.look--new{color:var(--new);border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.07)}
.look--imp{color:var(--imp);border-color:rgba(255,182,39,.5);border-style:dashed;background:rgba(255,182,39,.07)}
.look--old{color:var(--tx2);border-color:var(--border-l)}
#caption .nav{flex:none;display:flex;flex-direction:column;gap:8px;justify-content:center;align-items:flex-end}
#caption .nav .btns{display:flex;gap:8px}
.pbtn{border:1px solid var(--border-l);background:#1d1915;color:var(--tx1);border-radius:8px;padding:8px 16px;font:600 13px var(--f-body)}
.pbtn--go{background:linear-gradient(135deg,var(--primary),var(--primary-d));border-color:var(--primary);color:#1a1006}
.pbtn:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:4px;flex-wrap:wrap;max-width:320px;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;background:#3a332c;cursor:pointer}
.dots i.on{background:var(--primary)}
.dots i.done{background:#7a5a35}
.kbd{font-size:11px;color:var(--tx3)}
#exploreHint{display:none;margin-top:10px;font-size:13px;color:var(--tx2);background:#15120f;border:1px solid #2c241d;border-radius:99px;padding:6px 14px}
body.explore #caption{display:none}
body.explore #exploreHint{display:block}
body.explore #spot{display:none}

.tg{position:absolute;z-index:3;font:700 9px var(--f-body);letter-spacing:.08em;padding:1px 5px;border-radius:4px;line-height:13px;pointer-events:none;white-space:nowrap}
.tg--new{background:var(--new);color:#05262c;box-shadow:0 0 8px rgba(34,211,238,.55)}
.tg--imp{background:var(--imp);color:#2b1a00;box-shadow:0 0 8px rgba(255,182,39,.45)}
.tg.tl{top:-7px;left:8px}.tg.tr{top:-7px;right:8px}.tg.bl{bottom:-7px;left:8px}.tg.in{position:static;display:inline-block;vertical-align:2px;margin-left:6px}
.is-new{position:relative;outline:1px solid rgba(34,211,238,.75);outline-offset:2px;box-shadow:0 0 14px rgba(34,211,238,.18)}
.is-imp{position:relative;outline:1px dashed rgba(255,182,39,.85);outline-offset:3px}
.was{font-size:11px;color:#c99b4a;font-style:italic}
body.notags .tg,body.notags .was{display:none}
body.notags .is-new,body.notags .is-imp{outline:none;box-shadow:none}

#bg{position:absolute;inset:0;background-size:1280px 800px;background-repeat:no-repeat}
#mapLayer,#pageLayer,#hudLayer,#modalLayer,#toastLayer{position:absolute;inset:0;pointer-events:none}
#mapLayer>*,#pageLayer>*,#hudLayer>*,#modalLayer>*,#toastLayer>*{pointer-events:auto}
#mapSvg{position:absolute;left:0;top:0;pointer-events:none}
#spot{position:absolute;inset:0;pointer-events:none;z-index:60}
#spot .ring{fill:none;stroke:#fff;stroke-width:2.5;animation:ringPulse 1.6s ease-in-out infinite}
@keyframes ringPulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
.mark{position:absolute;z-index:61;width:24px;height:24px;border-radius:50%;background:#fff;color:#111;font:800 13px var(--f-body);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(0,0,0,.5),0 0 12px rgba(255,255,255,.6);pointer-events:none}

.mk{position:absolute;width:0;height:0;cursor:pointer}
.mk__node{position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#22201c,#0d0c0b);border:3px solid var(--c);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}
.mk--sm .mk__node{left:-16px;top:-16px;width:32px;height:32px;font-size:16px;border-width:2.5px}
.mk__lvl{position:absolute;left:-27px;top:-30px;width:18px;height:18px;transform:rotate(45deg);background:var(--c);border:1.5px solid rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.mk__lvl b{transform:rotate(-45deg);font:800 11px var(--f-body);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.mk__lbl{position:absolute;white-space:nowrap;font:700 11px var(--f-body);color:#fff;background:rgba(10,9,8,.86);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);border-radius:5px;padding:2px 7px;line-height:15px;text-shadow:0 1px 1px #000}
.mk__lbl small{display:block;font-weight:500;font-size:10px;color:var(--tx2)}
.mk__lbl.b{left:0;top:24px;transform:translateX(-50%)}
.mk__lbl.r{left:26px;top:0;transform:translateY(-50%)}
.mk__lbl.l{right:26px;top:0;transform:translateY(-50%)}
.mk__lbl.t{left:0;bottom:26px;transform:translateX(-50%)}
.mk--faded{opacity:.55}
.mk--hl .mk__node{outline:2px solid #fff;outline-offset:3px}
.mk--plain .mk__lbl{border-color:rgba(255,255,255,.25)}
.mk--ghost .mk__node{background:transparent;border:2px dashed rgba(255,255,255,.7);box-shadow:none}
.callout{position:absolute;white-space:nowrap;font:700 11px var(--f-body);background:rgba(10,9,8,.9);border:1px solid var(--c);border-radius:6px;padding:4px 8px;color:#fff;line-height:15px}
.callout small{display:block;font:500 10.5px var(--f-body);color:var(--tx2)}
.callout .ttl{display:flex;gap:6px;align-items:center;color:var(--c);letter-spacing:.04em;text-transform:uppercase}
.pill{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:700 10.5px var(--f-body);background:rgba(10,9,8,.92);border:1px solid var(--c);color:#fff;border-radius:99px;padding:1px 8px;line-height:15px;display:flex;gap:4px;align-items:center}
.pill em{font-style:normal;color:var(--c)}
.flow{animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}

.wm{position:absolute;left:12px;top:60px;width:240px;background:hsla(215,30%,10%,.97);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.wm__head{font:700 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px;display:flex;justify-content:space-between}
.wm__sec{font:700 9px var(--f-body);letter-spacing:.1em;text-transform:uppercase;margin:6px 0 2px;display:flex;gap:6px;align-items:center}
.wm__item{font-size:10.5px;padding:5px 0;border-top:1px solid var(--border)}
.wm__sec+.wm__item{border-top:none}
.wm__top{display:flex;justify-content:space-between;gap:6px;color:var(--tx2)}
.wm__top b{font-weight:600;color:var(--tx1);display:flex;gap:5px;align-items:center}
.wm__ph{color:var(--tx3);white-space:nowrap}
.wm__bar{height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:4px;overflow:hidden}
.wm__bar i{display:block;height:100%;background:#6bd4ff}
.wm__note{font-size:10px;margin-top:3px;display:flex;gap:4px;align-items:center}
.wm__empty{font-size:10px;color:var(--tx3);padding:4px 0;text-align:center}
.wm__item--threat{border-left:2px solid var(--red);padding-left:7px;margin-left:-4px}
.lf{position:absolute;left:12px;bottom:118px;display:flex;gap:4px;align-items:center;background:hsla(215,30%,10%,.92);border:1px solid var(--border);border-radius:8px;padding:5px 7px}
.lf span{font:700 9px var(--f-body);letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;margin-right:2px}
.lf button{background:transparent;border:1px solid var(--border);color:var(--tx2);font:600 11px var(--f-body);border-radius:6px;padding:3px 7px}
.lf button.on{background:hsl(32,50%,22%);border-color:var(--primary);color:var(--tx1)}
.banner{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:640px;height:40px;display:flex;align-items:center;gap:10px;padding:0 8px 0 6px;border-radius:9px;border:1px solid var(--bc);background:linear-gradient(90deg,var(--bg1),rgba(20,12,10,.95));box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:8;cursor:pointer}
.banner__ic{width:28px;height:28px;border-radius:50%;background:var(--bc);display:flex;align-items:center;justify-content:center;color:#1a0a06;font-size:15px}
.banner__t{flex:1;font-size:13px;line-height:1.15}
.banner__t small{display:block;font:700 9.5px var(--f-body);letter-spacing:.1em;color:var(--bc);text-transform:uppercase}
.banner__cd{font:700 16px var(--f-disp);color:#fff;letter-spacing:.04em}
.banner__cd small{font:500 10px var(--f-body);color:var(--tx2);margin-right:6px;letter-spacing:0}
.banner__go{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;font:600 12px var(--f-body);padding:5px 10px}
.fab{position:absolute;left:1217px;top:737px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#1c2b37,#0f1820);border:1px solid rgba(120,160,190,.28);display:flex;align-items:center;justify-content:center;color:#9aa3ab;font-size:22px;z-index:9}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#e53935;box-shadow:0 0 0 2px #0b0b0b}
.fab .dot{right:4px;top:5px}
.mailbtn{position:absolute;left:722px;top:736px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#1c2b37,#0f1820);border:1px solid rgba(120,160,190,.22);display:flex;align-items:center;justify-content:center;color:#e8e8e8;font-size:20px;z-index:9}
.badge{position:absolute;right:-6px;top:-7px;min-width:17px;height:17px;border-radius:99px;background:#e53935;color:#fff;font:800 10px var(--f-body);display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 0 2px #0b0b0b}
.more{position:absolute;left:1045px;top:470px;width:222px;background:hsla(215,30%,10%,.97);border:1px solid var(--border);border-radius:10px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;z-index:9}
.more__t{position:relative;height:58px;border-radius:7px;background:hsla(215,25%,16%,.85);border:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--tx2);font-size:11.5px}
.more__t .ic{font-size:19px;color:#b9c0c6}
.more__t .dot{right:7px;top:7px}
.more__t--soon{opacity:.45}
.more__t .soon{position:absolute;right:5px;top:4px;font:700 8px var(--f-body);border:1px solid var(--success);color:var(--success);border-radius:99px;padding:0 4px}
.more__t .why{font-size:9.5px;color:#ff8a7a;line-height:1;margin-top:-2px}
.more__t--ev{height:64px}

.wpanel{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;width:460px;background:hsl(30,30%,11%);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:16px;z-index:7}
.wpanel__head{display:flex;gap:12px;align-items:center}
.wpanel__icon{width:40px;height:40px;border-radius:50%;border:2px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:20px;background:#141210}
.wpanel__head h3{margin:0;font:700 16px var(--f-disp);letter-spacing:.02em}
.wpanel__sub{font-size:10.5px;color:var(--tx3)}
.wpanel__x{margin-left:auto;background:none;border:0;color:var(--tx3);font-size:16px}
.wpanel__body{margin:12px 0;font-size:12px;color:var(--tx2)}
.wpanel__row{display:flex;justify-content:space-between;padding:2px 0}
.wpanel__row b{color:var(--tx1);font-weight:600}
.evblock{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(34,211,238,.05);border:1px solid rgba(34,211,238,.35)}
.evblock__t{display:flex;align-items:center;gap:6px;font:600 12px var(--f-body);color:var(--tx1)}
.wpanel__act{display:flex;gap:8px}
.wbtn{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:hsl(30,32%,16%);color:var(--tx1);font:600 13px var(--f-body)}
.wbtn--gather{border-color:rgba(120,210,255,.5)}

.evpage{position:absolute;left:0;top:46px;width:1240px;height:678px;background:var(--page);padding:6px 16px 0 16px}
.evhead{display:flex;align-items:flex-end;gap:16px;height:58px}
.evhead h2{margin:0;font:700 26px var(--f-disp);display:flex;gap:8px;align-items:center}
.evhead h2 .ic{font-size:20px}
.evhead p{margin:2px 0 0;font-size:12px;color:var(--tx3)}
.tabs{display:flex;gap:4px;margin-left:24px;margin-bottom:2px;position:relative}
.tab{position:relative;background:var(--bg-elev);border:1px solid var(--border);color:var(--tx2);border-radius:8px;padding:7px 16px;font:600 14px var(--f-head);letter-spacing:.05em;text-transform:uppercase;display:flex;gap:7px;align-items:center}
.tab.on{background:hsl(32,40%,18%);border-color:var(--primary);color:var(--tx1)}
.tab .badge{position:static;box-shadow:none;height:16px;min-width:16px}
.srclegend{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--tx3);margin-bottom:4px}
.src{display:inline-flex;align-items:center;gap:4px;font:700 9.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px 2px 6px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);white-space:nowrap}
.evcols{display:flex;gap:14px;margin-top:12px;height:596px}
.evleft{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.evright{width:420px;flex:none;display:flex;flex-direction:column;gap:8px}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.sechead{display:flex;align-items:center;gap:8px;font:600 13px var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--tx2)}
.sechead small{font:500 11px var(--f-body);letter-spacing:0;text-transform:none;color:var(--tx3)}
.calm{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px dashed var(--border-l);border-radius:10px;color:var(--tx2);font-size:12.5px;background:#11100e}
.calm .ic{font-size:18px;color:var(--success)}
.hostile{border:1px solid var(--red);background:linear-gradient(180deg,rgba(224,90,61,.13),rgba(224,90,61,.03) 70%),var(--bg-elev);border-radius:12px;padding:12px 16px}
.hostile__top{display:flex;align-items:center;gap:12px}
.crest{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:color-mix(in srgb,var(--c) 30%,#141210);border:2px solid var(--c);flex:none}
.hostile__name{font:700 16px var(--f-head);letter-spacing:.03em}
.hostile__name small{display:block;font:500 11.5px var(--f-body);color:var(--tx2);letter-spacing:0}
.hostile__cd{margin-left:auto;text-align:right}
.hostile__cd b{font:700 24px var(--f-disp);color:#fff}
.hostile__cd small{display:block;font-size:11px;color:var(--tx3)}
.stages{display:flex;align-items:center;gap:0;margin:10px 0 8px}
.stg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx3)}
.stg i{width:16px;height:16px;border-radius:50%;border:2px solid var(--tx3);display:flex;align-items:center;justify-content:center;font-size:9px;color:#111;font-style:normal}
.stg.done{color:var(--tx2)}.stg.done i{background:var(--tx2);border-color:var(--tx2)}
.stg.now{color:#fff;font-weight:700}.stg.now i{border-color:var(--red);background:var(--red);box-shadow:0 0 0 3px rgba(224,90,61,.3)}
.stgline{width:34px;height:2px;background:var(--border-l);margin:0 6px}
.hostile__row{display:flex;gap:8px;align-items:center}
.hostile__facts{font-size:11.5px;color:var(--tx2);flex:1;line-height:1.45}
.hostile__facts b{color:var(--tx1)}
.btn{border-radius:8px;padding:7px 13px;font:600 12.5px var(--f-body);border:1px solid var(--border-l);background:#24201b;color:var(--tx1);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.btn--pri{background:linear-gradient(135deg,var(--primary),var(--primary-d));border-color:var(--primary);color:#1a1006}
.btn--red{border-color:rgba(224,90,61,.7);background:rgba(224,90,61,.16)}
.btn--sm{padding:4px 9px;font-size:11.5px}
.btn--ghost{background:transparent}
.queued{margin-top:10px;display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px dashed rgba(183,214,69,.5);border-radius:8px;font-size:11.5px;color:var(--tx2);background:rgba(183,214,69,.04)}
.queued b{color:var(--tx1)}
.qtag{font:700 9px var(--f-body);letter-spacing:.1em;border-radius:4px;padding:2px 5px;background:#2b2722;color:var(--tx2);text-transform:uppercase;flex:none}

let idx = 0, S = null, mode = 'guided', autoTimer = null, scale = 1;

function stateFor(i) { const s = baseState(); const st = STEPS[i]; s.day = st.day; s.time = st.time; st.build(s); return s; }

function go(i) {
  idx = Math.max(0, Math.min(STEPS.length - 1, i));
  clearTimeout(autoTimer);
  S = stateFor(idx);
  render();
  const st = STEPS[idx];
  if (st.auto && mode === 'guided') autoTimer = setTimeout(() => { st.auto[1](S); render(); }, st.auto[0]);
  renderCaption();
}

function render() {
  const s = S;
  const bgKey = s.view === 'world' ? (s.zoom === 'home' ? 'home' : 'world') : s.view;
  $('#bg').style.backgroundImage = `url("${BG[bgKey]}")`;
  $('#mapLayer').innerHTML = s.view === 'world' ? renderMap(s) : '';
  $('#pageLayer').innerHTML = s.view === 'events' && !s.oldEvents ? renderEvents(s) : '';
  $('#hudLayer').innerHTML = renderHud(s);
  $('#modalLayer').innerHTML = renderModals(s);
  $('#toastLayer').innerHTML = s.toasts.length ? `<div class="toasts" id="toasts">${s.toasts.map(renderToast).join('')}</div>` : '';
  if (s.anim === 'fly') { s.anim = null; flyIn(); }
  renderWeek();
  requestAnimationFrame(placeSpot);
  clearTimeout(render.spotTimer);
  render.spotTimer = setTimeout(placeSpot, 550);
}

function curve(a, b, bend) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  const cx = mx - dy / L * bend, cy = my + dx / L * bend;
  const at = t => [(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * cx + t * t * b[0], (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * cy + t * t * b[1]];
  return { d: `M${a[0]},${a[1]} Q${cx},${cy} ${b[0]},${b[1]}`, at };
}
const ROUTE_STYLE = {
  player: { c: C.me, dash: '9 6', w: 3 },
  hostile: { c: C.red, dash: '10 6', w: 3.5 },
  scout: { c: C.warn, dash: '2 6', w: 2.5 },
  ai: { c: C.scav, dash: '2 7', w: 3 },
  supply: { c: C.red, dash: '2 7', w: 3 },
  herd: { c: C.neutral, dash: '3 8', w: 3 },
};
function route(id, a, b, bend, kind, opts = {}) {
  const st = ROUTE_STYLE[kind], c = opts.c || st.c, cv = curve(a, b, bend);
  let svg = `<path id="${id}" d="${cv.d}" stroke="rgba(0,0,0,.55)" stroke-width="${st.w + 3}" fill="none" stroke-linecap="round"/>`
    + `<path d="${cv.d}" stroke="${c}" stroke-width="${st.w}" stroke-dasharray="${st.dash}" fill="none" stroke-linecap="round" class="flow" marker-end="url(#ah-${kind})"/>`;
  let html = '';
  if (opts.t != null) {
    const p = cv.at(opts.t);
    svg += `<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${c}" stroke="#111" stroke-width="2"/>`;
    if (opts.pill) html += `<div class="pill" style="--c:${c};left:${p[0] + (opts.px || 0)}px;top:${p[1] + (opts.py || -18)}px">${opts.pill}</div>`;
  }
  return { svg, html };
}
function marker(m) {
  const cls = ['mk', m.sm ? 'mk--sm' : '', m.faded ? 'mk--faded' : '', m.hl ? 'mk--hl' : '', m.ghost ? 'mk--ghost' : ''].join(' ');
  const lbl = m.label ? `<div class="mk__lbl ${m.lp || 'b'}">${m.label}${m.isNew && !m.sub ? NEW('in') : ''}${m.sub ? `<small>${m.sub}${m.isNew ? NEW('in') : ''}</small>` : ''}</div>` : '';
  return `<div class="${cls}" id="mk-${m.id}" data-act="poi:${m.id}" style="--c:${m.c};left:${m.x}px;top:${m.y}px">
    <div class="mk__node">${ic(m.icon)}</div>${m.lvl ? `<div class="mk__lvl"><b>${m.lvl}</b></div>` : ''}${lbl}</div>`;
}
function callout(id, x, y, c, title, sub, isNew = true, act = '') {
  return `<div class="callout" id="${id}" ${act ? `data-act="${act}"` : ''} style="--c:${c};left:${x}px;top:${y}px"><div class="ttl">${title}${isNew ? NEW('in') : ''}</div>${sub ? `<small>${sub}</small>` : ''}</div>`;
}

function renderMap(s) {
  const f = s.flags, show = layer => s.layer === 'all' || (s.layer === 'threats' && layer === 'threat') || (s.layer === 'events' && layer === 'event') || layer === 'base';

  const defs = Object.entries(ROUTE_STYLE).map(([k, v]) => `<marker id="ah-${k}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${v.c}"/></marker>`).join('')
    + `<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(224,85,155,.28)"/><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,140,200,.7)" stroke-width="2"/></pattern>`
    + `<radialGradient id="stormG"><stop offset="0" stop-color="rgba(160,200,245,.42)"/><stop offset=".75" stop-color="rgba(110,150,210,.22)"/><stop offset="1" stop-color="rgba(110,150,210,.05)"/></radialGradient>`;
  const add = r => { svg += r.svg; html += r.html; };

  if (s.zoom === 'out') {
    if (f.landmarks) {
      html += marker({ id: 'hold', x: 985, y: 660, c: C.red, icon: 'fire', lvl: 9, label: 'Red Talon Hold', sub: 'Faction base', lp: 'r', isNew: true });
      html += marker({ id: 'den', x: 365, y: 258, c: C.scav, icon: 'skull', lvl: 7, label: 'Scavenger Den', sub: 'Faction base · fogged', lp: 'l', faded: true, isNew: true });

    if (f.ironReturn) {

        ${cells.map(([x, y, r]) => `<path d="M${x + r * .55},${y - r * .15} l18,6 m-6,-8 l6,8 l-8,5" stroke="rgba(200,225,255,.9)" stroke-width="2" fill="none"/>`).join('')}</g>`;
      add(route('route-storm', [403, 655], [627, 580], -24, 'player', { t: 0.22, pill: `${ic('lightning')}<em>+40%</em> ETA 6:10`, py: 22, c: C.me }));
      html += callout('storm-lbl', 664, 425, C.storm, `${ic('lightning')} Storm front`, 'Drifting east · ends in 5h 40m');
    }
    if (f.drop) {
      html += marker({ id: 'crate', x: 300, y: 505, c: C.neutral, icon: 'box', label: 'Supply drop', sub: 'First to arrive takes it', lp: 'l', isNew: true });
      add(route('route-me-crate', [403, 655], [306, 527], -30, 'player', { t: 0.3, pill: 'You · 3:40', px: 44, py: 0 }));
      add(route('route-scav-crate', [365, 278], [303, 484], 26, 'ai', { t: 0.45, pill: `<em>Scavengers</em> · 4:05`, px: -98, py: 0 }));

    if (f.contam && show('event')) {

  } else {

  return `<svg id="mapSvg" width="1280" height="800"><defs>${defs}</defs>${svg}</svg>${html}`;

function renderHud(s) {
  let h = '';
  if (s.banner) h += `<div class="banner is-new" id="banner" data-act="banner" style="--bc:${C.red};--bg1:rgba(110,30,18,.95)">${NEW()}
    <div class="banner__ic">${ic('sword')}</div>
    <div class="banner__t"><small>Red Talon Raiders · Massing</small>Raid on <b>Red Lowlands</b> · war camp on the Frost Hold border</div>
    <div class="banner__cd"><small>departs in</small>5:12:40</div><button class="banner__go">View ›</button></div>`;
  if (s.view === 'world') {
    if (s.marches) h += renderMarches(s.marches);
    h += `<div class="lf is-new" id="lf">${NEW()}<span>Show</span>${['all', 'threats', 'events', 'none'].map(k => `<button class="${s.layer === k ? 'on' : ''}" data-act="layer:${k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>`;

      <div class="mrow__top"><span class="mrow__dot ${read ? 'read' : ''}"></span><div class="mrow__ic">${ic(l.icon)}</div><div class="mrow__s">${l.subj}<small>${l.from} · ${l.fac} · ${l.age}</small></div>
      <div class="mrow__r">${l.gift ? `<span class="rw">${ic('food')}5,000</span><button class="btn btn--pri btn--sm">Claim</button>` : ''}<span class="mrow__star">★</span></div></div>
      ${open ? letterBody(l) : ''}</div>`;
  }).join('') : `<div class="mrow"><div class="mrow__top"><span class="mrow__dot"></span><div class="mrow__ic" style="--c:#ccc">${ic('gift')}</div><div class="mrow__s">Iron Week · Tier 3 reward<small>Events · 1d</small></div><div class="mrow__r"><span class="rw">${ic('iron')}20k</span><button class="btn btn--pri btn--sm">Claim</button><span class="mrow__star">★</span></div></div></div>`;
  return `<div class="mailveil" data-act="closemail"></div><div class="mail" id="mail">
    <div class="mail__head">${ic('envelope')}<h3>MAIL</h3><small>${s.mailBadge} unread</small><span style="margin-left:auto"></span><button class="btn btn--pri btn--sm">Claim all (3)</button><button class="mail__x" data-act="closemail">${ic('x-circle')}</button></div>
    <div class="mail__body"><div class="mail__cats">
      ${cat('reports', 'sword', 'Reports', '1 mail · 0 unread', 0, 0)}
      ${cat('rewards', 'gift', 'Rewards', '2 mail · 1 unread', 1, 2)}
      ${cat('diplo', 'scroll', 'Diplomacy', '3 mail · 2 unread', 2, 1, 'is-new')}
      ${cat('system', 'gear', 'System', '1 mail · 1 unread', 1, 0)}
      ${cat('starred', 'star-burst', 'Starred', '0 mail · 0 unread', 0, 0)}
      ${cat('trash', 'trash', 'Trash', '0 mail', 0, 0)}
    </div><div class="mail__list"><div class="mail__lh"><h4>${diplo ? 'Diplomacy' : 'Rewards'}</h4><small>${diplo ? '3 mail' : '2 mail'}</small>
      ${diplo ? `<div class="milechip is-new" id="milechip">${NEW("tl")}${ic('crown')}<span>Milestone · <b>They have noticed you</b></span><span class="pips"><i class="f"></i><i class="${s.mail.open === 'rook' ? 'f' : ''}"></i><i></i></span><span>${s.mail.open === 'rook' ? 2 : 1} of 3 read</span></div>` : ''}</div>
    <div class="mail__rows">${rows}</div></div></div></div>`;
}
function letterBody(l) {
  const body = {
    vesk: ['"Headquarters level ten. My scouts laughed when they saw your walls go up. They have stopped laughing."', 'Red Lowlands was mine. Remember that.'],
    rook: ['"A little something for the new neighbour. Food keeps people friendly, and friendly people make good trading partners."', 'Mother Rook offers a gift. No strings, she says.'],
    kane: ['"You build like someone who intends to stay. The Covenant respects that. When you want terms, write."', ''],
  }[l.id];
  return `<div class="mrow__body"><p class="quote">${body[0]}</p>${body[1] ? `<p>${body[1]}</p>` : ''}
    ${l.gift ? `<div class="rgrid"><div class="rcell">${ic('food')}+5,000<small>Food</small></div></div>` : ''}
    <div class="mrow__acts">${l.gift ? `<button class="btn btn--pri">${ic('gift')}Claim</button>` : ''}<button class="btn">Reply…</button><span style="flex:1"></span><button class="btn">${ic('trash')}Delete</button></div></div>`;
}
function renderWelcome() {
  const line = (icon, c, t, r = '') => `<div class="wbline"><span style="color:${c}">${ic(icon)}</span><span>${t}</span>${r ? `<span class="r">${r}</span>` : ''}</div>`;
  return `<div class="veil"></div><div class="modal wb is-imp" id="wb">${IMP('tl')}
    <div class="modal__top"><div class="modal__icon">${ic('clock')}</div><div><div class="modal__title">Welcome Back!</div><div class="modal__sub">Away for 9h 12m</div></div>
      <span class="was" style="margin-left:auto;max-width:170px;text-align:right">was: "Resources collected" + a flat "Completed while away" list</span></div>
    <div class="wbthreat is-new" id="wb-threat">${NEW('tr')}<div class="wbsec__h">${srcTag('faction', 'Faction · Scavengers')}<b style="font-size:13px">Raid on Home Refuge, held for your return</b></div>
      <div class="wbline" style="color:var(--tx1)">Mother Rook's raid ripened overnight. Strikes never land while you're offline, so it waits.</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span style="font:700 22px var(--f-disp)">45:00</span><span style="font-size:11.5px;color:var(--tx2)">fresh countdown, starts now</span><span style="flex:1"></span><button class="btn btn--red">${ic('shield')}Defend now</button></div></div>
    <div class="wbsec is-new">${NEW('tr')}<div class="wbsec__h">${srcTag('faction')}</div>
      ${line('scroll', C.scav, '<b>Mother Rook</b> wrote: "Nothing personal." (Diplomacy)')}${line('fire', C.rebel, '<b>Pale Choir</b> grew into a settlement in Command Ruin')}</div>
    <div class="wbsec is-new">${NEW('tr')}<div class="wbsec__h">${srcTag('world')}${srcTag('calendar')}</div>
      ${line('flask', C.contam, 'Contamination spread <b>+2 cells</b> toward Red Lowlands')}${line('clock', C.primary, '<b>Raider Purge</b> started (Mon–Sat) · par: Scavenger Packs 3,600')}</div>
    <div class="wbsec"><div class="wbsec__h" style="font:700 10px var(--f-body);letter-spacing:.08em;color:var(--tx3);text-transform:uppercase">Resources collected while away</div>
      ${line('wood', '#c98a4a', 'wood', '+182,400')}${line('food', '#9cc35a', 'food', '+96,120')}${line('iron', '#aab', 'iron', '+71,880')}</div>
    <div style="display:flex;justify-content:flex-end;gap:8px;padding:4px 18px 16px"><button class="btn" data-act="closewb">Later</button><button class="btn btn--pri" data-act="closewb">Collect &amp; Continue</button></div></div>`;
}
function renderDirector() {
  const W = 600, H = 120, days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const pts = [[0, 20], [1, 34], [2, 48], [3, 62], [4, 96], [4.5, 70], [5, 22], [6, 14], [7, 12]];
  const P = pts.map(([d, v]) => [d / 7 * W, H - v / 100 * H]);
  const path = 'M' + P.map(p => p.join(',')).join(' L');
  const pin = (d, label, c, y) => `<g><line x1="${d / 7 * W}" x2="${d / 7 * W}" y1="${y + 8}" y2="${H}" stroke="${c}" stroke-dasharray="2 3"/><circle cx="${d / 7 * W}" cy="${y + 4}" r="4" fill="${c}"/><text x="${d / 7 * W + 6}" y="${y + 8}" fill="${c}" font-size="10.5" font-family="Outfit" font-weight="600">${label}</text></g>`;
  const strip = `<svg width="${W}" height="${H + 40}" style="display:block">
    <rect x="0" y="0" width="${W / 7 * 4}" height="${H}" fill="rgba(249,207,22,.05)"/><rect x="${W / 7 * 4}" y="0" width="${W / 7}" height="${H}" fill="rgba(224,90,61,.12)"/><rect x="${W / 7 * 5}" y="0" width="${W / 7 * 2}" height="${H}" fill="rgba(58,209,122,.06)"/>
    <path d="${path} L${W},${H} L0,${H} Z" fill="rgba(243,154,43,.14)"/><path d="${path}" stroke="${C.primary}" stroke-width="2.5" fill="none"/>
    ${pin(1.42, 'Storm', C.storm, 6)}${pin(1.6, 'Herd', C.neutral, 26)}${pin(2.38, 'Drop race', C.neutral, 46)}${pin(3.35, 'Rebels', C.rebel, 8)}${pin(4.38, 'Red Talon strike', C.red, 2)}${pin(5.45, 'Milestone', C.mile, 40)}
    ${days.map((d, i) => `<text x="${i / 7 * W + W / 14}" y="${H + 16}" text-anchor="middle" fill="#9a9086" font-size="11" font-family="Outfit">${d}</text>`).join('')}
    <text x="${W / 7 * 2}" y="${H + 34}" text-anchor="middle" fill="${C.warn}" font-size="11" font-weight="700" font-family="Outfit" letter-spacing="1">BUILD-UP</text>
    <text x="${W / 7 * 4.5}" y="${H + 34}" text-anchor="middle" fill="${C.red}" font-size="11" font-weight="700" font-family="Outfit" letter-spacing="1">PEAK</text>
    <text x="${W / 7 * 6}" y="${H + 34}" text-anchor="middle" fill="${C.me}" font-size="11" font-weight="700" font-family="Outfit" letter-spacing="1">CALM</text></svg>`;
  const quiet = `<svg width="${W}" height="64" style="display:block">${days.map((d, i) => `<rect x="${i / 7 * W + 2}" y="8" width="${W / 7 - 4}" height="28" rx="5" fill="${i < 6 ? '#1b1814' : 'rgba(155,107,255,.25)'}" stroke="${i < 6 ? '#3a332b' : C.rebel}"/>
      <text x="${i / 7 * W + W / 14}" y="27" text-anchor="middle" fill="${i < 6 ? '#6f665d' : '#fff'}" font-size="11" font-family="Outfit" font-weight="600">${i < 6 ? 'quiet' : 'FAILSAFE'}</text>`).join('')}
      <text x="0" y="56" fill="#9a9086" font-size="11" font-family="Outfit">Friendly factions, no threats for 6 days → day 7: a small <tspan fill="${C.rebel}" font-weight="700">Ash Brood rebel raid</tspan> is forced (sized from your power).</text></svg>`;
  const slot = (lab, items) => `<div class="slotrow"><span class="lab">${lab}</span>${items.map(([t, c, q]) => `<span class="slot ${q ? 'slot--q' : ''}" style="--c:${c}">${t}</span>`).join('')}</div>`;
  return `<div class="veil"></div><div class="modal dir" id="dir"><h3>The director<span class="dir__tag">Design explainer · not player UI</span></h3>
    <div class="dir__grid"><div class="dbox"><h4>This week's pacing</h4>${strip}
      <p>Tension builds through small world and faction events, peaks with one major strike, then a calm follows (12h minimum after an assault). Cycles, not dice.</p></div>
      <div class="dbox"><h4>Limits (what you see at once)</h4>
        ${slot('Hostile 1', [['Red Talon raid', C.red], ['Scavenger raid · queued', C.scav, 1]])}
        ${slot('Featured 1', [['Iron Week', C.primary]])}
        ${slot('Others 3', [['Storm', C.storm], ['Herd', C.neutral], ['Drop', C.neutral]])}
        ${slot('Queue', [['Contamination · waits for a slot', C.contam, 1]])}
        <p>Milestones are one-time story beats. They never queue behind a cooldown, but only one story popup shows per session.</p></div>
      <div class="dbox"><h4>Failsafe for a peaceful player</h4>${quiet}</div>
      <div class="dbox"><h4>Budget</h4><p style="margin-top:0">Threat budget comes from your <b>power</b>, with diminishing returns: 10k power → 600 pts, 20k → 1,000, 40k → 1,500. Each hostile event buys its threat from the budget.</p>
        <p><b style="color:var(--tx1)">The director decides how much pressure.</b> The factions decide what to do with it (who, where, and why), using their own brains.</p></div></div></div>`;
}
function renderToast(t, i) {
  return `<div class="toast is-imp" id="toast-${i}" style="--tc:${t.c}" ${t.go ? 'data-act="open:events"' : ''}>${i === 0 ? IMP('tr') : ''}
    <div class="toast__ic">${ic(t.icon)}</div><div style="flex:1"><div class="toast__t">${t.t}</div><div class="toast__m">${t.m}</div>
    ${t.src ? `<div class="toast__f">${srcTag(t.src)}${t.go ? `<span class="toast__go">${t.go}</span>` : ''}</div>` : ''}</div></div>`;
}
function flyIn() {
  const from = document.getElementById('tier-1'); if (!from) return;
  const fr = frameRect(from);
  for (let k = 0; k < 5; k++) {
    const el = document.createElement('div');
    el.innerHTML = ic('iron'); el.style.cssText = `position:absolute;left:${fr.x + 6}px;top:${fr.y + 6}px;font-size:18px;color:#cfd6de;z-index:70;pointer-events:none;filter:drop-shadow(0 0 4px #fff)`;
    $('#toastLayer').appendChild(el);
    el.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${430 - fr.x + (k - 2) * 6}px,${20 - fr.y}px) scale(.7)`, opacity: .9 }],
      { duration: 900, delay: k * 90, easing: 'cubic-bezier(.5,0,.4,1)', fill: 'forwards' }).onfinish = () => el.remove();
  }
}

function frameRect(el) {
  const f = $('#frame').getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: (r.left - f.left) / scale, y: (r.top - f.top) / scale, w: r.width / scale, h: r.height / scale };
}
function resolve(t) {
  if (typeof t !== 'string') return t;
  const el = document.querySelector('#frame ' + t) || document.querySelector(t);
  if (!el) return null;
  if (el instanceof SVGGraphicsElement) { const r = el.getBoundingClientRect(), f = $('#frame').getBoundingClientRect(); return { x: (r.left - f.left) / scale, y: (r.top - f.top) / scale, w: r.width / scale, h: r.height / scale }; }
  if (el.classList.contains('mk')) { const r = frameRect(el.querySelector('.mk__node')); const l = el.querySelector('.mk__lbl'); if (!l) return r; const lr = frameRect(l); const x = Math.min(r.x, lr.x), y = Math.min(r.y, lr.y); return { x, y, w: Math.max(r.x + r.w, lr.x + lr.w) - x, h: Math.max(r.y + r.h, lr.y + lr.h) - y }; }
  return frameRect(el);
}
function placeSpot() {
  const svg = $('#spot'), marks = $('#marks');
  const st = STEPS[idx];
  if (mode !== 'guided' || !st.spot) { svg.innerHTML = ''; marks.innerHTML = ''; return; }
  const rects = st.spot.map(resolve).filter(Boolean).map(r => ({ x: r.x - 6, y: r.y - 6, w: r.w + 12, h: r.h + 12 }));
  svg.innerHTML = `<defs><mask id="spm"><rect width="1280" height="800" fill="#fff"/>${rects.map(r => `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="10" fill="#000"/>`).join('')}</mask></defs>
    <rect width="1280" height="800" fill="rgba(3,3,3,.58)" mask="url(#spm)"/>${rects.map(r => `<rect class="ring" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="10"/>`).join('')}`;
  marks.innerHTML = (st.marks || []).map(([sel, n, side]) => { const r = resolve(sel); if (!r) return ''; const x = side === 'r' ? r.x + r.w + 6 : Math.max(-2, r.x - 30); return `<div class="mark" style="left:${x}px;top:${r.y - 4}px">${n}</div>`; }).join('');
}

function renderCaption() {
  const st = STEPS[idx];
  $('#capStep').textContent = `Step ${idx + 1} of ${STEPS.length}`;
  $('#capTopic').textContent = st.topic;
  $('#capDay').textContent = st.day < 0 ? 'The whole week' : `${DAYS[st.day]}${st.day === 7 ? ' (next week)' : ''} ${st.time}`;
  $('#capText').innerHTML = st.text;
  $('#capLook').innerHTML = (st.look || []).map(([k, t]) => `<span class="look look--${k}">${k === 'new' ? 'NEW' : k === 'imp' ? 'IMPROVED' : 'EXISTING'} · ${t}</span>`).join('');
  $('#back').disabled = idx === 0; $('#next').disabled = idx === STEPS.length - 1;
  $('#dots').innerHTML = STEPS.map((_, i) => `<i class="${i === idx ? 'on' : i < idx ? 'done' : ''}" data-step="${i}" title="${STEPS[i].topic}"></i>`).join('');
  fit();
}
function renderWeek() {
  const d = STEPS[idx].day;
  $('#week').innerHTML = DAYS.map((n, i) => `<span class="${d === i ? 'on' : d < 0 && i < 7 ? 'span' : ''}">${n}${i === 7 ? '+' : ''}</span>`).join('');
}
function fit() {
  const capH = mode === 'guided' ? $('#caption').offsetHeight + 10 : $('#exploreHint').offsetHeight + 10;
  const availW = window.innerWidth - 24, availH = window.innerHeight - $("#proto").offsetHeight - 10 - capH - 10;
  scale = Math.max(0.3, Math.min(1, availW / 1280, availH / 800));
  $('#frame').style.transform = `scale(${scale})`;
  $('#frameWrap').style.width = 1280 * scale + 'px'; $('#frameWrap').style.height = 800 * scale + 'px';
  $('#caption').style.width = Math.max(1280 * scale, Math.min(960, availW)) + 'px';
  requestAnimationFrame(placeSpot);
}
function setMode(m) {
  mode = m; document.body.classList.toggle('explore', m === 'explore');
  $('#mGuided').classList.toggle('on', m === 'guided'); $('#mExplore').classList.toggle('on', m === 'explore');
  fit();
}

function act(a) {
  const [k, v] = a.split(':'), s = S;
  if (k === 'more') { s.more = !s.more; }
  else if (k === 'tile') { if (v === 'events') { Object.assign(s, { view: 'events', oldEvents: false, more: false, mail: null, panel: null }); s.dots = { fab: false, tile: false }; } else s.toasts = [{ c: C.world, icon: 'warning', t: 'Not part of this prototype', m: `${v[0].toUpperCase() + v.slice(1)} is unchanged.` }]; }
  else if (k === 'tab') { s.tab = v; }
  else if (k === 'claim') { const i = +v; s.iron.ready = s.iron.ready.filter(x => x !== i); s.iron.claimed.push(i); s.anim = 'fly'; s.toasts = [{ c: C.success, icon: 'gift', t: `Iron Week · Tier ${i + 1} claimed`, m: TIERS[i].rw.map(r => r[1] + ' ' + r[0]).join(' · '), src: 'calendar' }]; s.dots = { fab: false, tile: false }; }
  else if (k === 'mail') { s.mail = s.mail ? null : { cat: 'diplo', open: null }; s.more = false; }
  else if (k === 'mailcat') { s.mail.cat = v; s.mail.open = null; }
  else if (k === 'mailopen') { s.mail.open = s.mail.open === v ? null : v; }
  else if (k === 'closemail') { s.mail = null; }
  else if (k === 'closewb') { s.welcome = false; }
  else if (k === 'layer') { s.layer = v; }
  else if (k === 'poi') { s.panel = v === 'outpost-hl' ? null : v; }
  else if (k === 'closepanel') { s.panel = null; }
  else if (k === 'banner') { Object.assign(s, { view: 'events', tab: 'active', more: false, mail: null }); }
  else if (k === 'open') {
    if (v === 'events') Object.assign(s, { view: 'events', oldEvents: false, tab: 'active', more: false, mail: null, panel: null, toasts: [] });
    else { const what = v.slice(4); s.view = 'world'; s.zoom = what === 'herd' ? 'home' : 'out'; s.more = false; s.flags = { landmarks: true, [what === 'threat' ? 'threat' : what]: true, ...(what === 'storm' ? {} : {}) }; s.layer = 'all'; s.panel = { storm: null, herd: 'herd', contam: 'contam', boss: 'boss', rebel: 'rebel', threat: 'camp' }[what] || null; if (what === 'threat') s.marches = { threats: [{ name: 'Red Talon warband', ph: 'Massing · 5:12:40', pct: 62 }], mine: [] }; }
  }
  else return;
  render();
}
document.addEventListener('click', e => {
  const st = e.target.closest('[data-step]'); if (st) { go(+st.dataset.step); return; }
  const t = e.target.closest('[data-act]'); if (t && t.closest('#frame')) { e.stopPropagation(); act(t.dataset.act); }
});
$('#next').onclick = () => go(idx + 1);
$('#back').onclick = () => go(idx - 1);
$('#mGuided').onclick = () => { setMode('guided'); go(idx); };
$('#mExplore').onclick = () => setMode('explore');
$('#backGuided').onclick = () => { setMode('guided'); go(idx); };
$('#tagsToggle').onchange = e => document.body.classList.toggle('notags', !e.target.checked);
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(idx + 1); else if (e.key === 'ArrowLeft') go(idx - 1); });
window.addEventListener('resize', fit);
if (document.fonts) document.fonts.ready.then(() => requestAnimationFrame(placeSpot));
const startAt = parseInt(new URLSearchParams(location.search).get('step') || '1', 10) - 1;
go(isNaN(startAt) ? 0 : startAt);
</script>
</body>
